name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build RemoteMouse.exe
        run: pyinstaller --onefile --noconsole --name RemoteMouse remote_mouse.py

      - name: Smoke test (starts, serves the page, stops)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\RemoteMouse.exe -ArgumentList "--no-browser","--port","8799","--pin","123456" -PassThru
          Start-Sleep -Seconds 6
          $r = Invoke-WebRequest -UseBasicParsing http://localhost:8799/manifest.webmanifest
          if ($r.StatusCode -ne 200) { throw "manifest not served" }
          $i = Invoke-WebRequest -UseBasicParsing http://localhost:8799/icon-192.png
          if ($i.Headers["Content-Type"] -notlike "image/png*") { throw "icon not served" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteMouse-windows
          path: dist/RemoteMouse.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemoteMouse.exe
