name: RemoteX server (tests + Windows EXE)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag remotex-v<version>) with the files"
        type: boolean
        default: false
  push:
    paths: ["remotex/server/**", "remotex/protocol/**", ".github/workflows/remotex-server.yml"]
    tags: ["remotex-v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r remotex/server/requirements.txt
      - name: Unit tests (45)
        working-directory: remotex/server
        run: python -m unittest discover -s tests -v

  exe:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r remotex/server/requirements.txt pyinstaller
      - name: Run the tests on Windows too
        working-directory: remotex/server
        run: python -m unittest discover -s tests
      - name: Build RemoteXServer.exe
        working-directory: remotex/server
        shell: cmd
        run: build_exe.bat
      - name: GUI self-test (opens the real window, closes it)
        working-directory: remotex/server
        shell: pwsh
        run: |
          $p = Start-Process dist\RemoteXServer.exe -ArgumentList "--gui-selftest","3000","--data-dir","$env:RUNNER_TEMP\rx-gui","--port","48866" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "GUI self-test exit code $($p.ExitCode)" }
          $r = Get-Content "$env:RUNNER_TEMP\rx-gui\selftest.txt" -Raw
          Write-Host $r
          if ($r -notmatch "allow_dialog=ok") { throw "Allow dialog failed" }
          if ($r -notmatch "tray=ok") { throw "Tray icon failed" }
      - name: Smoke test the EXE (TLS port answers, hello is sent)
        working-directory: remotex/server
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\rx-smoke"
          $p = Start-Process dist\RemoteXServer.exe -ArgumentList "--headless","--dry-run-input","--data-dir",$dir,"--port","48867" -PassThru
          Start-Sleep -Seconds 8
          $c = New-Object System.Net.Sockets.TcpClient("127.0.0.1",48867)
          $ssl = New-Object System.Net.Security.SslStream($c.GetStream(), $false, ({$true}))
          $ssl.AuthenticateAsClient("localhost")
          if (-not $ssl.IsAuthenticated) { throw "TLS failed" }
          Write-Host "TLS handshake OK with the EXE"
          Stop-Process -Id $p.Id -Force
      - name: Build the installer (Inno Setup)
        working-directory: remotex/server
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $v = (python -c "import remotex_server;print(remotex_server.__version__)")
          & $iscc "/DAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path dist\Remote-Mouse-Setup.exe)) { throw "installer not built" }
      - name: Silent install test (files, shortcut, firewall rule, uninstall)
        working-directory: remotex/server
        shell: pwsh
        run: |
          $p = Start-Process dist\Remote-Mouse-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\Remote Mouse"
          $exe = "$dir\RemoteXServer.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          if (-not (Test-Path "$env:PUBLIC\Desktop\Remote Mouse.lnk")) { throw "desktop shortcut missing" }
          $fw = netsh advfirewall firewall show rule name="Remote Mouse Server" | Out-String
          if ($fw -notmatch "Remote Mouse Server") { throw "firewall rule missing" }
          Write-Host "install OK (exe, desktop shortcut, firewall rule)"
          Get-Process RemoteXServer -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Get-ChildItem $dir -Filter unins*.exe | Select-Object -First 1
          Start-Process $u.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 2
          if (Test-Path $exe) { throw "uninstall left files" }
          Write-Host "uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteXServer-windows
          path: |
            remotex/server/dist/RemoteXServer.exe
            remotex/server/dist/Remote-Mouse-Setup.exe
      - name: Release tag name
        id: rel
        shell: bash
        run: echo "tag=remotex-v$(grep -oP '__version__ = \"\K[^\"]+' remotex/server/remotex_server/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/remotex-v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Remote Mouse ${{ steps.rel.outputs.tag }}
          body: Remote Mouse ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            remotex/server/dist/RemoteXServer.exe
            remotex/server/dist/Remote-Mouse-Setup.exe
