name: RemoteX app (analyze, test, APK)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag remotex-v<version>) with the files"
        type: boolean
        default: false
  push:
    paths: ["remotex/app/**", "remotex/server/**", "remotex/protocol/**", ".github/workflows/remotex-app.yml"]
    tags: ["remotex-v*"]

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r remotex/server/requirements.txt
      - run: flutter --version
      - name: Prepare Android project
        working-directory: remotex/app
        run: python tool/prepare_android.py
      - name: flutter pub get
        working-directory: remotex/app
        run: flutter pub get
      - name: flutter analyze
        working-directory: remotex/app
        run: flutter analyze --no-fatal-infos
      - name: Dart unit tests (shared protocol vectors)
        working-directory: remotex/app
        run: flutter test test/protocol_test.dart test/update_test.dart test/bluetooth_hid_test.dart test/windows_test.dart
      - name: Dart client vs real Python server
        working-directory: remotex/app
        env:
          REMOTEX_SERVER_CMD: python ../server/run_server.py
        run: flutter test test/integration/server_integration_test.dart
      - name: Build release APK (signed with the committed update key)
        working-directory: remotex/app
        env:
          RX_KEYSTORE: ${{ github.workspace }}/remotex/app/signing/remotex.jks
          RX_STORE_PASS: remotex-update
          RX_KEY_ALIAS: remotex
          RX_KEY_PASS: remotex-update
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Name the APKs
        working-directory: remotex/app/build/app/outputs/flutter-apk
        run: |
          mv app-arm64-v8a-release.apk Remote-Mouse-arm64.apk
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteX-apk
          path: remotex/app/build/app/outputs/flutter-apk/Remote-Mouse-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-scaffold
          path: remotex/app/android
      - name: Release tag name
        id: rel
        shell: bash
        run: echo "tag=remotex-v$(grep -oP '__version__ = \"\K[^\"]+' remotex/server/remotex_server/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/remotex-v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Remote Mouse ${{ steps.rel.outputs.tag }}
          body: Remote Mouse ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: remotex/app/build/app/outputs/flutter-apk/Remote-Mouse-*.apk
